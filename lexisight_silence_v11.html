
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .term-wrap {
    background: #4B3BCE;
    min-height: 480px;
    width: 100%;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  .term-left-outer {
    position: absolute; left: 7%; top: 50%; transform: translateY(-50%);
    height: 200px; overflow: hidden;
    mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);
  }
  .term-left { display: flex; flex-direction: column; gap: 11px; transition: transform 0.5s ease; }
  .term-line {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em;
    color: rgba(255,255,255,0.35); white-space: nowrap; padding: 2px 0;
  }
  .term-line.active {
    background: rgba(255,255,255,0.18); padding: 2px 8px;
    border-radius: 2px; color: #fff; margin-left: -8px;
  }
  .term-right {
    position: absolute; right: 6%; top: 50%; transform: translateY(-50%);
    text-align: right; max-width: 210px; font-size: 10px;
    letter-spacing: 0.09em; color: rgba(255,255,255,0.25); line-height: 1.85;
  }
  .silence-screen {
    position: absolute; inset: 0; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: #0d0d0d;
    opacity: 0; pointer-events: none;
  }
  .silence-screen.show { opacity: 1; pointer-events: auto; }
  .silence-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 4px;
    font-weight: 900;
    font-style: italic;
    color: #ffffff;
    white-space: nowrap;
    line-height: 1;
    overflow: visible;
  }
  .silence-text.grow {
    animation: growFont 1.6s cubic-bezier(0.4, 0, 1, 1) forwards;
  }
  @keyframes growFont {
    0%   { font-size: 4px;    opacity: 0; }
    15%  { font-size: 48px;   opacity: 1; }
    55%  { font-size: 48px;   opacity: 1; }
    100% { font-size: 600px;  opacity: 1; }
  }
  .main-page {
    position: absolute; inset: 0; background: #0a0a0f; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  .main-page.show { opacity: 1; pointer-events: auto; }
  .main-logo {
    font-family: Georgia, serif;
    font-size: 56px; font-weight: 900; font-style: italic; color: #fff;
  }
  .main-logo span { color: #8b5cf6; }
  .main-sub {
    margin-top: 12px; font-size: 11px; letter-spacing: 0.18em;
    color: rgba(255,255,255,0.35); font-family: 'Courier New', monospace;
    text-transform: uppercase;
  }
  .replay-btn {
    margin-top: 32px; background: rgba(255,255,255,0.08); border: none;
    color: rgba(255,255,255,0.5); font-family: 'Courier New', monospace;
    font-size: 10px; letter-spacing: 0.15em; padding: 7px 16px; border-radius: 4px; cursor: pointer;
  }
  .replay-btn:hover { background: rgba(255,255,255,0.16); color: #fff; }
</style>

<h2 class="sr-only">LexiSight ISL terminal loader</h2>

<div class="term-wrap">
  <div class="term-left-outer">
    <div class="term-left" id="leftLines"></div>
  </div>
  <div class="term-right" id="rightText"></div>
  <div class="silence-screen" id="silenceScreen">
    <div class="silence-text" id="silenceText">Silence Ends Here</div>
  </div>
  <div class="main-page" id="mainPage">
    <div class="main-logo">Lexi<span>Sight</span></div>
    <div class="main-sub">Bridging Silence Through AI</div>
    <button class="replay-btn" onclick="replay()">// REPLAY</button>
  </div>
</div>

<script>
  const leftData = [
    "// YOU'RE ABOUT TO BRIDGE THE SILENCE...",
    '// INITIALIZING NEURAL INTERFACE...',
    '// DECRYPTING HAND PATTERNS...',
    '// SYNCHRONIZING REAL-TIME AI...',
    '// TRANSMITTING SIGN SIGNALS...',
    '// UNLOCKING GESTURE DIMENSIONS...',
    '// CALIBRATING SIGN MODELS...',
    '// LOADING ISL DATASET...',
  ];
  const rightFull = '// HANG TIGHT. THE AI MODELS ARE LOADING. THE SIGN INTELLIGENCE IS WORTH THE WAIT...';
  const lineHeight = 33;

  function buildLeft() {
    const c = document.getElementById('leftLines');
    c.innerHTML = '';
    leftData.forEach((text, i) => {
      const div = document.createElement('div');
      div.className = 'term-line';
      div.textContent = text;
      div.id = 'll' + i;
      c.appendChild(div);
    });
    c.style.transform = 'translateY(0px)';
  }

  function run() {
    buildLeft();
    document.getElementById('rightText').textContent = '';
    const screen = document.getElementById('silenceScreen');
    const txt = document.getElementById('silenceText');
    const main = document.getElementById('mainPage');

    screen.style.opacity = '0';
    screen.classList.remove('show');
    txt.classList.remove('grow');
    txt.style.fontSize = '4px';
    main.classList.remove('show');

    let activeIdx = 0;
    const container = document.getElementById('leftLines');

    function advanceHighlight() {
      document.querySelectorAll('.term-line').forEach(l => l.classList.remove('active'));
      if (activeIdx < leftData.length) {
        document.getElementById('ll' + activeIdx).classList.add('active');
        container.style.transform = `translateY(-${Math.max(0, activeIdx - 2) * lineHeight}px)`;
        activeIdx++;
        setTimeout(advanceHighlight, 520);
      } else {
        setTimeout(triggerSilence, 300);
      }
    }

    let rightIdx = 0;
    function typeRight() {
      const el = document.getElementById('rightText');
      if (rightIdx <= rightFull.length) {
        el.textContent = rightFull.slice(0, rightIdx);
        rightIdx++;
        setTimeout(typeRight, 28);
      }
    }

    function triggerSilence() {
      screen.style.opacity = '1';
      screen.classList.add('show');
      void screen.offsetWidth;
      txt.style.fontSize = '';
      txt.classList.add('grow');
      setTimeout(() => {
        main.classList.add('show');
      }, 1300);
      setTimeout(() => {
        screen.style.transition = 'opacity 0.4s ease';
        screen.style.opacity = '0';
      }, 1400);
    }

    setTimeout(advanceHighlight, 400);
    setTimeout(typeRight, 500);
  }

  function replay() {
    const screen = document.getElementById('silenceScreen');
    screen.style.transition = 'none';
    run();
  }
  run();
</script>
