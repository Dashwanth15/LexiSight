model:
  name: verz_plus_holistic_transformer
  input_frames: 30
  input_features: 225           # pose 33 + left hand 21 + right hand 21, x/y/z
  projection_dim: 192
  num_transformer_layers: 3
  num_attention_heads: 6
  feedforward_dim: 384
  dropout: 0.35
  classifier_hidden: 128

data:
  manifest_path: ml/data_processed/manifest_verz_plus_train.csv   # built by train_verz_plus.py
  split_strategy: signer_disjoint
  min_samples_per_class: 3

augmentation:
  gaussian_noise_sigma: 0.012
  scale_range: [0.88, 1.12]
  rotation_range_deg: 12
  frame_dropout_count: 3
  temporal_shift_frames: 2
  landmark_dropout_prob: 0.15

training:
  epochs: 60
  batch_size: 32
  learning_rate: 0.0007
  min_learning_rate: 0.000001
  weight_decay: 0.01
  focal_gamma: 1.5
  label_smoothing: 0.05
  warmup_epochs: 4
  early_stopping_patience: 12

runtime:
  intra_op_threads: 8
  inter_op_threads: 2

export:
  label_map_path: public/model/label_map_verz_plus.json
  checkpoint_name: verz_plus_best.keras
  history_name: verz_plus_history.json

seed: 42
